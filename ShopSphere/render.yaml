services:
  - type: web
    name: shopsphere
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SHOPSPHERE_DB_URL
        sync: false
      - key: SHOPSPHERE_DB_USER
        sync: false
      - key: SHOPSPHERE_DB_PASSWORD
        sync: false
